name: Run Job Collectors

on:
  workflow_dispatch:
    inputs:
      queries_file:
        description: Path to queries YAML config
        required: true
        default: configs/queries.yaml
      scoring_file:
        description: Path to scoring YAML config
        required: true
        default: configs/scoring.yaml
      email_enabled:
        description: Send HTML email report
        required: true
        default: "false"
      run_v2_jobs:
        description: Run V2 jobs aggregator and email report
        required: true
        default: "false"
      v2_limit:
        description: V2 collector limit
        required: true
        default: "2"
      v2_top:
        description: V2 top jobs to export and email
        required: true
        default: "100"
      v2_search_profile:
        description: "V2 search profile"
        default: "local_student"
        type: choice
        options:
          - "local_student"
          - "remote"
      v2_clean_results:
        description: Clean V2 search-result pages before export
        required: true
        default: "true"
      v2_drop_far_locations:
        description: Drop far non-remote locations from V2 results
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      v2_drop_unknown_locations:
        description: Drop unknown non-remote locations from V2 results
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

jobs:
  run-collectors:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run full pipeline
        if: ${{ inputs.run_v2_jobs != 'true' }}
        env:
          EMAIL_ENABLED: ${{ inputs.email_enabled }}
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_SMTP_USER: ${{ secrets.EMAIL_SMTP_USER }}
          EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m src.main --queries "${{ inputs.queries_file }}" --scoring "${{ inputs.scoring_file }}"

      - name: Run V2 job aggregator
        if: ${{ inputs.run_v2_jobs == 'true' }}
        run: |
          CLEAN_ARGS=""
          if [ "${{ inputs.v2_clean_results }}" = "true" ]; then
            CLEAN_ARGS="--email-clean-results"
          fi
          DROP_FAR_ARGS=""
          if [ "${{ inputs.v2_search_profile }}" = "local_student" ] && [ "${{ inputs.v2_drop_far_locations }}" = "true" ]; then
            DROP_FAR_ARGS="--drop-far-locations"
          fi
          DROP_UNKNOWN_ARGS=""
          if [ "${{ inputs.v2_search_profile }}" = "local_student" ] && [ "${{ inputs.v2_drop_unknown_locations }}" = "true" ]; then
            DROP_UNKNOWN_ARGS="--drop-unknown-locations"
          fi
          OUTPUT_PATH="output/v2_jobs.json"
          POOL_PATH="output/v2_candidate_pool.json"
          HISTORY_PATH="output/v2_sent_jobs_history.json"
          RUN_STATS_PATH="output/v2_run_stats.json"
          if [ "${{ inputs.v2_search_profile }}" = "remote" ]; then
            OUTPUT_PATH="output/v2_remote_jobs.json"
            POOL_PATH="output/v2_remote_candidate_pool.json"
            HISTORY_PATH="output/v2_remote_sent_jobs_history.json"
            RUN_STATS_PATH="output/v2_remote_run_stats.json"
          fi
          python -m src.job_aggregator \
            --search-profile "${{ inputs.v2_search_profile }}" \
            --output "$OUTPUT_PATH" \
            --candidate-pool-output "$POOL_PATH" \
            --history-path "$HISTORY_PATH" \
            --run-stats-path "$RUN_STATS_PATH" \
            --limit "${{ inputs.v2_limit }}" \
            --top "${{ inputs.v2_top }}" \
            --campania-part-time-first \
            $CLEAN_ARGS \
            $DROP_FAR_ARGS \
            $DROP_UNKNOWN_ARGS

      - name: Verify V2 Candidate Pool artifacts
        if: ${{ inputs.run_v2_jobs == 'true' }}
        run: |
          POOL_JSON="output/v2_candidate_pool.json"
          POOL_XLSX="output/v2_candidate_pool.xlsx"
          if [ "${{ inputs.v2_search_profile }}" = "remote" ]; then
            POOL_JSON="output/v2_remote_candidate_pool.json"
            POOL_XLSX="output/v2_remote_candidate_pool.xlsx"
          fi
          for artifact in \
            "$POOL_JSON" \
            "$POOL_XLSX" \
            output/v2_collector_stats.json \
            output/v2_collector_stats.xlsx
          do
            test -f "$artifact"
            echo "Verified $artifact"
          done

      - name: Send V2 email report
        if: ${{ inputs.run_v2_jobs == 'true' }}
        env:
          EMAIL_ENABLED: ${{ inputs.email_enabled }}
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_SMTP_USER: ${{ secrets.EMAIL_SMTP_USER }}
          EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          INPUT_PATH="output/v2_jobs.json"
          STATS_PATH="output/v2_run_stats.json"
          if [ "${{ inputs.v2_search_profile }}" = "remote" ]; then
            INPUT_PATH="output/v2_remote_jobs.json"
            STATS_PATH="output/v2_remote_run_stats.json"
          fi
          python -m src.v2_email_report \
            --search-profile "${{ inputs.v2_search_profile }}" \
            --input "$INPUT_PATH" \
            --stats "$STATS_PATH" \
            --top "${{ inputs.v2_top }}"

      - name: Commit sent jobs history
        if: ${{ success() && inputs.email_enabled == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for history_file in output/sent_jobs_history.json output/v2_sent_jobs_history.json output/v2_remote_sent_jobs_history.json; do
            if [ -f "$history_file" ]; then
              git add "$history_file"
            fi
          done
          if git diff --cached --quiet; then
            echo "No sent jobs history changes to commit."
          else
            git commit -m "Update sent jobs history"
            git push
          fi

      - name: Upload job results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: job-results
          path: |
            output/latest/
            output/v2_jobs.json
            output/v2_jobs.csv
            output/v2_jobs.xlsx
            output/v2_candidate_pool.json
            output/v2_candidate_pool.xlsx
            output/v2_collector_stats.json
            output/v2_collector_stats.xlsx
            output/v2_sent_jobs_history.json
            output/v2_run_stats.json
            output/v2_remote_jobs.json
            output/v2_remote_jobs.csv
            output/v2_remote_jobs.xlsx
            output/v2_remote_candidate_pool.json
            output/v2_remote_candidate_pool.xlsx
            output/v2_remote_sent_jobs_history.json
            output/v2_remote_run_stats.json
          if-no-files-found: warn
