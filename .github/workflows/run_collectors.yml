name: Run Job Collectors

on:
  workflow_dispatch:
    inputs:
      queries_file:
        description: Path to queries YAML config
        required: true
        default: configs/queries.yaml
      scoring_file:
        description: Path to scoring YAML config
        required: true
        default: configs/scoring.yaml
      email_enabled:
        description: Send HTML email report
        required: true
        default: "false"

permissions:
  contents: write

jobs:
  run-collectors:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run full pipeline
        env:
          EMAIL_ENABLED: ${{ inputs.email_enabled }}
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_SMTP_USER: ${{ secrets.EMAIL_SMTP_USER }}
          EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m src.main --queries "${{ inputs.queries_file }}" --scoring "${{ inputs.scoring_file }}"

      - name: Commit sent jobs history
        if: ${{ success() && inputs.email_enabled == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/sent_jobs_history.json
          if git diff --cached --quiet; then
            echo "No sent jobs history changes to commit."
          else
            git commit -m "Update sent jobs history"
            git push
          fi

      - name: Upload job results
        uses: actions/upload-artifact@v4
        with:
          name: job-results
          path: output/latest/
