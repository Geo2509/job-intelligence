name: Advanced Job Search

on:
  workflow_dispatch:
    inputs:
      queries_file:
        description: Path to queries YAML config
        required: true
        default: configs/queries.yaml
      scoring_file:
        description: Path to scoring YAML config
        required: true
        default: configs/scoring.yaml
      email_enabled:
        description: Send HTML email reports
        required: true
        default: "true"
      run_student_v2:
        description: Run Student/local V2 pipeline
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      run_remote_legacy:
        description: Run remote legacy pipeline
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      v2_limit:
        description: V2 collector limit
        required: true
        default: "2"
      v2_top:
        description: V2 top jobs to export and email
        required: true
        default: "100"
      v2_clean_results:
        description: Clean V2 search-result pages before export
        required: true
        default: "true"
      v2_drop_far_locations:
        description: Drop far non-remote locations from Student V2 results
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      v2_drop_unknown_locations:
        description: Drop unknown non-remote locations from Student V2 results
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

jobs:
  student-v2:
    if: ${{ inputs.run_student_v2 == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Student V2 job aggregator
        run: |
          CLEAN_ARGS=""
          if [ "${{ inputs.v2_clean_results }}" = "true" ]; then
            CLEAN_ARGS="--email-clean-results"
          fi
          DROP_FAR_ARGS=""
          if [ "${{ inputs.v2_drop_far_locations }}" = "true" ]; then
            DROP_FAR_ARGS="--drop-far-locations"
          fi
          DROP_UNKNOWN_ARGS=""
          if [ "${{ inputs.v2_drop_unknown_locations }}" = "true" ]; then
            DROP_UNKNOWN_ARGS="--drop-unknown-locations"
          fi
          python -m src.job_aggregator \
            --search-profile local_student \
            --output output/v2_jobs.json \
            --candidate-pool-output output/v2_candidate_pool.json \
            --history-path output/v2_sent_jobs_history.json \
            --run-stats-path output/v2_run_stats.json \
            --limit "${{ inputs.v2_limit }}" \
            --top "${{ inputs.v2_top }}" \
            --campania-part-time-first \
            $CLEAN_ARGS \
            $DROP_FAR_ARGS \
            $DROP_UNKNOWN_ARGS \
            --selection-fallback true

      - name: Verify Student V2 artifacts
        run: |
          for artifact in \
            output/v2_jobs.xlsx \
            output/v2_candidate_pool.xlsx \
            output/v2_run_stats.json \
            output/collector_health.json \
            output/collector_health.xlsx \
            output/collector_recommendations.md \
            output/url_pattern_debug.json \
            output/url_pattern_debug.xlsx \
            output/unknown_urls.xlsx \
            output/url_pattern_recommendations.md
          do
            test -f "$artifact"
            echo "Verified $artifact"
          done

      - name: Send Student V2 email report
        env:
          EMAIL_ENABLED: ${{ inputs.email_enabled }}
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_SMTP_USER: ${{ secrets.EMAIL_SMTP_USER }}
          EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python -m src.v2_email_report \
            --search-profile local_student \
            --input output/v2_jobs.json \
            --stats output/v2_run_stats.json \
            --top "${{ inputs.v2_top }}"

      - name: Commit Student V2 sent jobs history
        if: ${{ success() && inputs.email_enabled == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f output/v2_sent_jobs_history.json ]; then
            git add output/v2_sent_jobs_history.json
          fi
          if git diff --cached --quiet; then
            echo "No Student V2 sent jobs history changes to commit."
          else
            git commit -m "Update student V2 sent jobs history"
            git pull --rebase
            git push
          fi

      - name: Upload Student V2 results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: student-v2-results
          path: |
            output/v2_jobs.json
            output/v2_jobs.csv
            output/v2_jobs.xlsx
            output/v2_candidate_pool.json
            output/v2_candidate_pool.xlsx
            output/v2_collector_stats.json
            output/v2_collector_stats.xlsx
            output/v2_sent_jobs_history.json
            output/v2_run_stats.json
            output/collector_health.json
            output/collector_health.xlsx
            output/collector_recommendations.md
            output/url_pattern_debug.json
            output/url_pattern_debug.xlsx
            output/unknown_urls.xlsx
            output/url_pattern_recommendations.md
          if-no-files-found: warn

  remote-legacy:
    if: ${{ inputs.run_remote_legacy == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run remote legacy collectors and scoring
        env:
          JOB_INTELLIGENCE_QUERIES_FILE: ${{ inputs.queries_file }}
          JOB_INTELLIGENCE_SCORING_FILE: ${{ inputs.scoring_file }}
        run: |
          python remotive_collector.py
          python remotejobs_org_collector.py
          python remotefirstjobs_collector.py
          python jobicy_collector.py
          python workanywhere_collector.py
          python himalayas_collector.py
          python arbeitnow_collector.py
          python duckduckgo_collector.py
          python scoring_jobs.py

      - name: Build remote legacy report and send email
        env:
          EMAIL_ENABLED: ${{ inputs.email_enabled }}
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_SMTP_USER: ${{ secrets.EMAIL_SMTP_USER }}
          EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          JOB_INTELLIGENCE_SCORING_FILE: ${{ inputs.scoring_file }}
        run: |
          python - <<'PY'
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          from src.main import (
              COLLECTOR_OUTPUT_FILES,
              OUTPUT_DIR,
              count_csv_rows,
              send_email_report,
              validate_output_files,
              write_summary,
          )
          from scoring_jobs import score_jobs

          run_started = datetime.now(ZoneInfo("Europe/Rome"))
          OUTPUT_DIR.mkdir(parents=True, exist_ok=True)
          collector_counts = {
              name: count_csv_rows(path)
              for name, path in COLLECTOR_OUTPUT_FILES.items()
              if Path(path).exists()
          }
          csv_path = OUTPUT_DIR / "jobs_scored.csv"
          xlsx_path = OUTPUT_DIR / "jobs_scored.xlsx"
          top_csv_path = OUTPUT_DIR / "top_50_jobs.csv"
          top_jobs_xlsx_path = OUTPUT_DIR / "top_jobs.xlsx"
          scoring_result = score_jobs(
              csv_path=csv_path,
              xlsx_path=xlsx_path,
              top_csv_path=top_csv_path,
              top_xlsx_path=top_jobs_xlsx_path,
          )
          summary_path = write_summary(
              run_started,
              collector_counts,
              scoring_result,
              [csv_path, xlsx_path, top_csv_path, top_jobs_xlsx_path, OUTPUT_DIR / "run_summary.md"],
          )
          validate_output_files([csv_path, xlsx_path, top_csv_path, top_jobs_xlsx_path, summary_path])
          email_was_sent = send_email_report(run_started, collector_counts, scoring_result)
          print(f"Remote legacy email sent: {email_was_sent}")
          PY

      - name: Verify remote legacy artifacts
        run: |
          for artifact in \
            output/latest/jobs_scored.xlsx \
            output/latest/top_jobs.xlsx \
            output/latest/run_summary.md
          do
            test -f "$artifact"
            echo "Verified $artifact"
          done

      - name: Commit remote legacy sent jobs history
        if: ${{ success() && inputs.email_enabled == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f output/sent_jobs_history.json ]; then
            git add output/sent_jobs_history.json
          fi
          if git diff --cached --quiet; then
            echo "No remote legacy sent jobs history changes to commit."
          else
            git commit -m "Update remote legacy sent jobs history"
            git pull --rebase
            git push
          fi

      - name: Upload remote legacy results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: remote-legacy-results
          path: |
            output/latest/jobs_scored.csv
            output/latest/jobs_scored.xlsx
            output/latest/top_50_jobs.csv
            output/latest/top_jobs.xlsx
            output/latest/run_summary.md
            output/sent_jobs_history.json
          if-no-files-found: warn
