name: Run Job Collectors

on:
  workflow_dispatch:
    inputs:
      queries_file:
        description: Path to queries YAML config
        required: true
        default: configs/queries.yaml
      scoring_file:
        description: Path to scoring YAML config
        required: true
        default: configs/scoring.yaml
      email_enabled:
        description: Send HTML email report
        required: true
        default: "false"
      run_v2_jobs:
        description: Run V2 jobs aggregator and email report
        required: true
        default: "false"
      v2_limit:
        description: V2 collector limit
        required: true
        default: "2"
      v2_top:
        description: V2 top jobs to export and email
        required: true
        default: "100"
      v2_clean_results:
        description: Clean V2 search-result pages before export
        required: true
        default: "true"
      v2_drop_far_locations:
        description: Drop far non-remote locations from V2 results
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      v2_drop_unknown_locations:
        description: Drop unknown non-remote locations from V2 results
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

jobs:
  run-collectors:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run full pipeline
        if: ${{ inputs.run_v2_jobs != 'true' }}
        env:
          EMAIL_ENABLED: ${{ inputs.email_enabled }}
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_SMTP_USER: ${{ secrets.EMAIL_SMTP_USER }}
          EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m src.main --queries "${{ inputs.queries_file }}" --scoring "${{ inputs.scoring_file }}"

      - name: Run V2 jobs pipeline
        if: ${{ inputs.run_v2_jobs == 'true' }}
        env:
          EMAIL_ENABLED: ${{ inputs.email_enabled }}
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_SMTP_USER: ${{ secrets.EMAIL_SMTP_USER }}
          EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          CLEAN_ARGS=""
          if [ "${{ inputs.v2_clean_results }}" = "true" ]; then
            CLEAN_ARGS="--email-clean-results"
          fi
          DROP_FAR_ARGS=""
          if [ "${{ inputs.v2_drop_far_locations }}" = "true" ]; then
            DROP_FAR_ARGS="--drop-far-locations"
          fi
          DROP_UNKNOWN_ARGS=""
          if [ "${{ inputs.v2_drop_unknown_locations }}" = "true" ]; then
            DROP_UNKNOWN_ARGS="--drop-unknown-locations"
          fi
          python -m src.job_aggregator \
            --output output/v2_jobs.json \
            --limit "${{ inputs.v2_limit }}" \
            --top "${{ inputs.v2_top }}" \
            --campania-part-time-first \
            $CLEAN_ARGS \
            $DROP_FAR_ARGS \
            $DROP_UNKNOWN_ARGS
          python -m src.v2_email_report \
            --input output/v2_jobs.json \
            --top "${{ inputs.v2_top }}"

      - name: Commit sent jobs history
        if: ${{ success() && inputs.email_enabled == 'true' && inputs.run_v2_jobs != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/sent_jobs_history.json
          if git diff --cached --quiet; then
            echo "No sent jobs history changes to commit."
          else
            git commit -m "Update sent jobs history"
            git push
          fi

      - name: Upload job results
        uses: actions/upload-artifact@v4
        with:
          name: job-results
          path: |
            output/latest/
            output/v2_jobs.json
            output/v2_jobs.csv
            output/v2_jobs.xlsx
          if-no-files-found: warn
