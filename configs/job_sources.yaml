aggregators:
  - name: Indeed
    enabled: true
    type: aggregator
    priority: high
    country: Italy
    base_url: https://it.indeed.com
    notes: Major job aggregator for Italian local and remote searches.
  - name: LinkedIn Jobs
    enabled: true
    type: aggregator
    priority: high
    country: Italy
    base_url: https://www.linkedin.com/jobs
